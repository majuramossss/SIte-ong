{% extends 'base.html' %}
{% block title %}Erro {{ code }}{% endblock %}
{% block content %}
<section class="container error-page section"><p class="eyebrow">Erro {{ code }}</p><h1>Vamos encontrar<br><em>outro caminho?</em></h1><p class="lead">{{ message }}</p><div class="button-row"><a class="button" href="{{ url_for('home') }}">Voltar ao início {{ seta_icone() }}</a><a class="text-link" href="{{ public_whatsapp }}" target="_blank" rel="noopener noreferrer">Fale com a equipe <span class="sr-only">(abre em nova aba)</span></a></div></section>
{% endblock %}
