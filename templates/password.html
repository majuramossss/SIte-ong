{% extends 'base.html' %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<section class="container form-page narrow section"><a class="text-link" href="{{ url_for('admin') }}">← Voltar ao painel</a><p class="eyebrow">Segurança da conta</p><h1 class="compact-title">Um acesso <em>protegido.</em></h1><form method="post" action="{{ url_for('password') }}" class="form-panel stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="current_password">Senha atual</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required></div><div class="field"><label for="new_password">Nova senha</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" aria-describedby="password-help" required><p id="password-help" class="field-help">Escolha uma senha longa e exclusiva, diferente da atual.</p></div><div class="button-row"><button type="submit" class="button">Atualizar senha</button><a class="text-link" href="{{ url_for('admin') }}">Cancelar</a></div></form></section>
{% endblock %}
